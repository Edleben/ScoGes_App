name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install checksum-verified validation tools
        run: node scripts/ci/install-tools.mjs actionlint gitleaks
      - name: Validate workflow and shell scripts
        run: |
          actionlint -color
          shellcheck scripts/ci/start-smtp.sh
      - name: Check changed-file formatting
        id: format
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: pnpm format:changed
      - id: lint
        run: pnpm lint
      - name: Generate routes and check types
        id: types
        run: |
          pnpm exec next typegen
          pnpm typecheck
      - name: Validate CI safety guards
        id: guards
        run: pnpm test:ci-tools
      - name: Unit and contract tests
        id: unit
        run: |
          mkdir -p reports
          pnpm test --reporter=default --reporter=junit --outputFile.junit=reports/unit-junit.xml
      - name: Production build without production credentials
        id: build
        run: pnpm build
      - name: Dependency security audit
        id: audit
        run: pnpm audit --audit-level=high --json > reports/dependency-audit.json
      - name: Scan Git history for secrets
        id: secrets
        if: always()
        run: gitleaks git --redact --no-banner --report-format json --report-path reports/gitleaks.json
      - name: Publish safe quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
      - name: Quality summary
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          node -e 'const fs=require("fs"); const s=JSON.parse(process.env.STEP_RESULTS); const rows=Object.entries(s).map(([k,v])=>"| "+k+" | "+v.outcome+" |").join("\n"); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"## Quality and security\n\n| Step | Result |\n| --- | --- |\n"+rows+"\n");'

  integration:
    name: Isolated integration and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install checksum-verified local service tools
        run: node scripts/ci/install-tools.mjs supabase mailpit
      - name: Start disposable Supabase and apply every migration
        run: |
          supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1
          supabase db reset --local --no-seed > "$RUNNER_TEMP/supabase-migrations.log" 2>&1
          supabase status -o env > "$RUNNER_TEMP/supabase-status.env"
          chmod 600 "$RUNNER_TEMP/supabase-status.env"
          node scripts/ci/export-environment.mjs "$RUNNER_TEMP/supabase-status.env"
      - name: Start isolated TLS SMTP fixture
        run: bash scripts/ci/start-smtp.sh
      - name: Verify Auth and schema connectivity
        run: pnpm check:supabase
      - name: Verify SMTP authentication and TLS
        run: pnpm check:smtp
      - name: Database constraints, RLS and invitation lifecycle
        run: pnpm test:db
      - name: Install matching Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build against disposable local services
        run: pnpm build
      - name: Browser authentication and smoke journeys
        run: pnpm test:e2e
      - name: Assert browser suite has no missing, skipped or flaky tests
        if: always()
        run: node scripts/ci/browser-summary.mjs
      - name: Publish sanitized browser summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/e2e-summary.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Dispose isolated services
        if: always()
        run: |
          supabase stop --no-backup || true
          if [ -f "$RUNNER_TEMP/scoges-smtp/pid" ]; then
            kill "$(cat "$RUNNER_TEMP/scoges-smtp/pid")" || true
          fi

  required:
    name: Required validation
    if: always()
    needs: [quality, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          printf 'Quality: %s\nIntegration: %s\n' "$QUALITY_RESULT" "$INTEGRATION_RESULT"
          printf '## Required validation\n\nQuality: **%s**\n\nIntegration: **%s**\n' "$QUALITY_RESULT" "$INTEGRATION_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$QUALITY_RESULT" = success
          test "$INTEGRATION_RESULT" = success
